<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 680" width="100%" height="100%" style="background: #0d1117; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; border-radius: 12px;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="dotGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    /* CSS Animations */
    @keyframes moveParticle1 {
      0% { offset-distance: 0%; opacity: 0; }
      20% { opacity: 1; }
      80% { opacity: 1; }
      100% { offset-distance: 100%; opacity: 0; }
    }

    @keyframes pulseCircle {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.08); opacity: 1; }
    }

    @keyframes pulseGlow {
      0%, 100% { filter: drop-shadow(0 0 8px rgba(168, 85, 247, 0.4)); }
      50% { filter: drop-shadow(0 0 18px rgba(168, 85, 247, 0.8)); }
    }

    /* Animated Dot Paths */
    .particle {
      fill: #38bdf8;
      filter: url(#dotGlow);
    }

    .p1 { offset-path: path('M 400 110 L 400 170'); animation: moveParticle1 2s infinite ease-in-out; }
    
    .p-jooble-in   { offset-path: path('M 400 230 C 400 280, 130 280, 130 330'); animation: moveParticle1 2.5s infinite ease-in-out 0.2s; }
    .p-remotive-in { offset-path: path('M 400 230 C 400 280, 310 280, 310 330'); animation: moveParticle1 2.5s infinite ease-in-out 0.4s; }
    .p-jobicy-in   { offset-path: path('M 400 230 C 400 280, 490 280, 490 330'); animation: moveParticle1 2.5s infinite ease-in-out 0.6s; }
    .p-arbeit-in   { offset-path: path('M 400 230 C 400 280, 670 280, 670 330'); animation: moveParticle1 2.5s infinite ease-in-out 0.8s; }

    .p-jooble-out   { offset-path: path('M 130 380 C 130 430, 400 430, 400 480'); animation: moveParticle1 2.5s infinite ease-in-out 1.2s; }
    .p-remotive-out { offset-path: path('M 310 380 C 310 430, 400 430, 400 480'); animation: moveParticle1 2.5s infinite ease-in-out 1.4s; }
    .p-jobicy-out   { offset-path: path('M 490 380 C 490 430, 400 430, 400 480'); animation: moveParticle1 2.5s infinite ease-in-out 1.6s; }
    .p-arbeit-out   { offset-path: path('M 670 380 C 670 430, 400 430, 400 480'); animation: moveParticle1 2.5s infinite ease-in-out 1.8s; }

    .agent-node { animation: pulseGlow 3s infinite ease-in-out; }
    .agent-center { transform-origin: 400px 200px; animation: pulseCircle 3s infinite ease-in-out; }
  </style>

  <!-- Connecting Lines -->
  <!-- Top to Gateway -->
  <path d="M 400 110 L 400 170" stroke="#30363d" stroke-width="2" fill="none" />

  <!-- Gateway to Providers -->
  <path d="M 400 230 C 400 280, 130 280, 130 330" stroke="#30363d" stroke-width="2" fill="none" />
  <path d="M 400 230 C 400 280, 310 280, 310 330" stroke="#30363d" stroke-width="2" fill="none" />
  <path d="M 400 230 C 400 280, 490 280, 490 330" stroke="#30363d" stroke-width="2" fill="none" />
  <path d="M 400 230 C 400 280, 670 280, 670 330" stroke="#30363d" stroke-width="2" fill="none" />

  <!-- Providers to Response -->
  <path d="M 130 380 C 130 430, 400 430, 400 480" stroke="#30363d" stroke-width="2" fill="none" />
  <path d="M 310 380 C 310 430, 400 430, 400 480" stroke="#30363d" stroke-width="2" fill="none" />
  <path d="M 490 380 C 490 430, 400 430, 400 480" stroke="#30363d" stroke-width="2" fill="none" />
  <path d="M 670 380 C 670 430, 400 430, 400 480" stroke="#30363d" stroke-width="2" fill="none" />

  <!-- Animated Data Particles -->
  <circle class="particle p1" r="4" />
  <circle class="particle p-jooble-in" r="4" />
  <circle class="particle p-remotive-in" r="4" />
  <circle class="particle p-jobicy-in" r="4" />
  <circle class="particle p-arbeit-in" r="4" />
  <circle class="particle p-jooble-out" r="4" />
  <circle class="particle p-remotive-out" r="4" />
  <circle class="particle p-jobicy-out" r="4" />
  <circle class="particle p-arbeit-out" r="4" />

  <!-- 1. Input Command Bar -->
  <g transform="translate(160, 50)">
    <rect width="480" height="60" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.5" />
    <text x="24" y="36" fill="#a7f3d0" font-size="14" font-family="monospace">&gt; GET /api/v1/jobs?keyword=QA&amp;location=Europe</text>
  </g>

  <!-- 2. Central Agent / Gateway Node -->
  <g class="agent-node" transform="translate(400, 200)">
    <circle cx="0" cy="0" r="32" fill="url(#purpleGlow)" class="agent-center" />
    <circle cx="0" cy="0" r="38" fill="none" stroke="#a855f7" stroke-width="1.5" opacity="0.5" />
    <!-- Pulse Sparkle Icon -->
    <path d="M 0 -12 L 3 -3 L 12 0 L 3 3 L 0 12 L -3 3 L -12 0 L -3 -3 Z" fill="#ffffff" />
    <text x="0" y="52" fill="#8b949e" font-size="12" text-anchor="middle">aggregator-gateway</text>
  </g>

  <!-- 3. Provider Nodes -->
  <!-- Jooble -->
  <g transform="translate(60, 330)">
    <rect width="140" height="50" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5" />
    <circle cx="25" cy="25" r="10" fill="#f97316" />
    <text x="45" y="30" fill="#c9d1d9" font-size="13" font-weight="600">jooble.org</text>
  </g>

  <!-- Remotive -->
  <g transform="translate(240, 330)">
    <rect width="140" height="50" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5" />
    <circle cx="25" cy="25" r="10" fill="#3b82f6" />
    <text x="45" y="30" fill="#c9d1d9" font-size="13" font-weight="600">remotive.com</text>
  </g>

  <!-- Jobicy -->
  <g transform="translate(420, 330)">
    <rect width="140" height="50" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5" />
    <circle cx="25" cy="25" r="10" fill="#10b981" />
    <text x="45" y="30" fill="#c9d1d9" font-size="13" font-weight="600">jobicy.com</text>
  </g>

  <!-- Arbeitnow -->
  <g transform="translate(600, 330)">
    <rect width="140" height="50" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5" />
    <circle cx="25" cy="25" r="10" fill="#eab308" />
    <text x="43" y="30" fill="#8b949e" font-size="12" font-weight="600">arbeitnow</text>
  </g>

  <!-- 4. Output Response Box -->
  <g transform="translate(160, 480)">
    <rect width="480" height="150" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.5" />
    <text x="24" y="32" fill="#8b949e" font-size="13" font-family="monospace">response.json</text>
    
    <text x="24" y="60" fill="#38bdf8" font-size="13" font-family="monospace">{</text>
    <text x="44" y="80" fill="#7dd3fc" font-size="13" font-family="monospace">"count": <tspan fill="#f43f5e">16</tspan>,</text>
    <text x="44" y="100" fill="#7dd3fc" font-size="13" font-family="monospace">"source": <tspan fill="#a3e635">"Jooble, Remotive, Jobicy"</tspan>,</text>
    <text x="44" y="120" fill="#7dd3fc" font-size="13" font-family="monospace">"status": <tspan fill="#a3e635">"200 OK"</tspan></text>
    <text x="24" y="140" fill="#38bdf8" font-size="13" font-family="monospace">}</text>
  </g>
</svg>
